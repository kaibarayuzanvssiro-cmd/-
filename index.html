<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo Fantasy VI Lite</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="screen-wrap">
        <canvas id="game" width="512" height="384" aria-label="game screen"></canvas>
      </section>
      <section class="hud">
        <h1>Neo Fantasy VI Lite</h1>
        <p>SFC版FF6風のドット調RPGデモ（探索＋コマンドバトル）</p>
        <ul>
          <li>移動: 矢印キー / WASD</li>
          <li>決定: Enter / Z</li>
          <li>キャンセル: X / Backspace</li>
          <li>メニュー操作: ↑↓</li>
        </ul>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
